<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeMind AI — Redirecting…</title>
</head>
<body>
  <p>Redirecting to TradeMind AI…</p>
  <script type="text/javascript">
    // GitHub Pages SPA fallback: unknown routes hit 404.html.
    // Redirect to index.html so the React app can render the correct page.
    var base = '/trade-assit/';
    var path = window.location.pathname;
    if (path.startsWith(base)) {
      window.location.replace(window.location.origin + base + 'index.html');
    } else {
      window.location.replace(window.location.origin + base + 'index.html');
    }
  </script>
</body>
</html>
